<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Rutina de Entrenamiento</title>
<meta name="theme-color" content="#12141c">
<style>
:root {
  --bg: #f4f5f7;
  --bg-elev: #ffffff;
  --text: #1a1c22;
  --text-dim: #656b76;
  --border: #e1e3e8;
  --accent: #2563eb;
  --accent-text: #ffffff;
  --danger: #dc2626;
  --ok: #16a34a;
  --warn: #d97706;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  /* Colores de nutrición: reservados solo para calorías y macros, iguales en todas las pantallas. */
  --m-kcal: #2563eb;
  --m-carb: #c2410c;
  --m-prot: #be185d;
  --m-lip: #6d28d9;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141c;
    --bg-elev: #1c1f29;
    --text: #eef0f4;
    --text-dim: #9096a3;
    --border: #2c3040;
    --accent: #3b82f6;
    --accent-text: #ffffff;
    --danger: #f87171;
    --ok: #4ade80;
    --warn: #fbbf24;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --m-kcal: #60a5fa;
    --m-carb: #fb923c;
    --m-prot: #f472b6;
    --m-lip: #a78bfa;
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body { padding-bottom: 76px; }

button { font-family: inherit; }

h1, h2, h3 { margin: 0 0 .5em 0; line-height: 1.25; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
p { margin: 0 0 .75em 0; }

/* Topbar (desktop) */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: center; gap: 24px;
  padding: 10px 16px;
}
.brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.tabs { display: none; gap: 4px; flex-wrap: wrap; }
.tab-btn {
  border: none; background: transparent; color: var(--text-dim);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: .92rem; font-weight: 600;
}
.tab-btn.active { background: var(--accent); color: var(--accent-text); }

/* Bottom nav (mobile) */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bn-btn {
  flex: 1; border: none; background: transparent; color: var(--text-dim);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; font-size: .68rem; font-weight: 600; cursor: pointer;
}
.bn-btn span { font-size: 1.25rem; }
.bn-btn.active { color: var(--accent); }

@media (min-width: 760px) {
  .tabs { display: flex; }
  .bottomnav { display: none; }
  body { padding-bottom: 24px; }
}

/* Main */
#app {
  max-width: 900px; margin: 0 auto;
  padding: 14px 12px 24px;
}
.view { display: block; }
.view[hidden] { display: none; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* Forms */
label { display: block; font-size: .82rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
input, select, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: .95rem;
  margin-bottom: 12px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; min-height: 60px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 10px; cursor: pointer;
  background: var(--accent); color: var(--accent-text);
  padding: 10px 16px; font-size: .9rem; font-weight: 700;
}
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { padding: 6px 10px; font-size: .82rem; }
.btn.tiny { padding: 4px 8px; font-size: .74rem; }
.btn.block { width: 100%; }
.btn:active { transform: scale(.97); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* Rutina view */
.routine-select-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.day-block {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.day-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; cursor: pointer; background: var(--bg);
}
.day-header h2 { margin: 0; font-size: 1rem; }
.day-body { padding: 10px 14px 14px; }
.day-note { font-size: .82rem; color: var(--text-dim); margin-bottom: 10px; }
.day-note-edit { display: flex; gap: 6px; margin-bottom: 10px; }
.day-note-edit input { margin-bottom: 0; }

.exercise-row {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  background: var(--bg);
}
.exercise-top { display: flex; align-items: center; gap: 8px; }
.exercise-grp { font-size: .72rem; color: var(--text-dim); font-weight: 700; min-width: 30px; }
.exercise-name { flex: 1; font-weight: 600; font-size: .92rem; }
.exercise-name-input { flex: 1; margin: 0; padding: 6px 8px; font-size: .9rem; }
.exercise-meta { font-size: .78rem; color: var(--text-dim); margin-top: 4px; }
.exercise-actions { display: flex; gap: 4px; }
.icon-btn {
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; font-size: 1rem; padding: 4px 6px; border-radius: 6px;
}
.icon-btn:hover { background: var(--border); }

.exercise-link-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.exercise-link-row input { margin: 0; }

/* Bloques (supersets) */
.block-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  background: var(--bg);
}
.block-header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding: 10px 12px; flex-wrap: wrap;
}
.block-header-main { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; min-width: 160px; }
.block-chevron { font-size: .75rem; color: var(--text-dim); width: 12px; }
.block-title { font-weight: 700; font-size: .88rem; }
.block-summary { font-size: .76rem; color: var(--text-dim); }
.block-descanso { display: flex; align-items: center; gap: 4px; font-size: .76rem; color: var(--text-dim); }
.block-descanso label { margin: 0; font-size: .7rem; }
.block-descanso input { width: 56px; margin: 0; padding: 4px 6px; text-align: center; }
.block-body { padding: 0 10px 10px; }

/* Bloque en modo Entrenar (acordeón: uno abierto a la vez) */
.block-train { padding: 0; }
.block-header-train {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; cursor: pointer;
}
.block-cerrado .block-header-train { padding: 12px 14px; }
.block-hamburguesa { font-size: 1.15rem; color: var(--text-dim); }
.block-titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.block-titles h3 { margin: 0; text-transform: none; letter-spacing: 0; color: var(--text); font-size: .98rem; font-weight: 700; }
.block-summary { font-size: .78rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block-body-train { padding: 0 14px 14px; }
.block-train.block-abierto { border-color: var(--accent); }
.block-exlist { margin-bottom: 6px; }
.block-exname {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; font-size: .92rem; gap: 8px;
}
.table-scroll { overflow-x: auto; }
.block-table th:not(:first-child):not(:last-child) { border-bottom: 2px solid var(--border); }
.timer-row-btn { font-size: 1.1rem; }

/* Series table (Entrenar) */
.series-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.series-table th {
  font-size: .68rem; text-transform: uppercase; color: var(--text-dim);
  text-align: center; padding: 2px 4px; font-weight: 700;
}
.series-table td { padding: 3px; text-align: center; }
.series-table input {
  margin: 0; padding: 8px 2px; text-align: center; font-size: .9rem;
  width: 100%; min-width: 44px;
}
.series-table .serie-num { font-size: .8rem; color: var(--text-dim); font-weight: 700; }
.serie-num-btn {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 1px solid var(--accent); border-radius: 6px;
  color: var(--accent); font-size: .8rem; font-weight: 700; font-family: inherit;
  padding: 4px 7px; cursor: pointer;
}
.serie-num-btn:hover, .serie-num-btn:active { background: color-mix(in srgb, var(--accent) 32%, transparent); }
.serie-del { color: var(--danger); }

.exercise-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.exercise-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.exercise-card-head h3 { text-transform: none; letter-spacing: 0; color: var(--text); font-size: .98rem; font-weight: 700; margin: 0; }
.exercise-badge { font-size: .72rem; color: var(--accent); font-weight: 700; }
.exercise-hint { font-size: .78rem; color: var(--text-dim); margin: 4px 0 6px; }
.exercise-volumen { font-size: .78rem; color: var(--ok); font-weight: 700; margin-top: 4px; }
.block-vol-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.block-vol-row .exercise-volumen { margin-top: 0; }
.block-vol-row .icon-btn { font-size: .74rem; white-space: nowrap; }
.block-vol-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.block-vol-actions .icon-btn { border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }

.session-summary {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  font-size: .85rem; margin-bottom: 4px;
}
.session-summary b { font-size: 1.05rem; }

/* Historial */
.hist-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 8px; background: var(--bg-elev); cursor: pointer;
}
.hist-item .h-left { display: flex; flex-direction: column; gap: 2px; }
.hist-item .h-date { font-weight: 700; font-size: .92rem; }
.hist-item .h-sub { font-size: .78rem; color: var(--text-dim); }
.hist-item .h-vol { font-weight: 700; color: var(--accent); text-align: right; }
.hist-detail { margin-top: -4px; margin-bottom: 8px; padding: 0 14px 12px; font-size: .85rem; }
.hist-detail table { width: 100%; border-collapse: collapse; }
.hist-detail th, .hist-detail td { text-align: center; padding: 3px 4px; font-size: .78rem; }
.hist-detail th { color: var(--text-dim); }
.empty-state { text-align: center; color: var(--text-dim); padding: 30px 10px; font-size: .9rem; }

.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  z-index: 60; box-shadow: var(--shadow);
}
@media (min-width: 760px) { .toast { bottom: 24px; } }

/* Timer */
.timer-fab {
  position: fixed; right: 16px; bottom: 90px; z-index: 30;
  width: 52px; height: 52px; border-radius: 50%;
  border: none; background: var(--accent); color: #fff; font-size: 1.4rem;
  box-shadow: var(--shadow); cursor: pointer;
}
@media (min-width: 760px) { .timer-fab { bottom: 24px; } }

.timer-widget {
  position: fixed; right: 16px; bottom: 150px; z-index: 40;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 10px 14px; text-align: center;
  width: 190px;
}
@media (min-width: 760px) { .timer-widget { bottom: 90px; } }
.timer-drag { color: var(--text-dim); font-size: .7rem; cursor: grab; user-select: none; }
.timer-time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
.timer-actions { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
.timer-adjust { display: flex; gap: 6px; justify-content: center; }
.timer-widget.ringing .timer-time { color: var(--danger); }

/* Comando de voz — agrupado junto al cronómetro en la esquina inferior
   derecha (nunca en la izquierda, donde empieza el texto de las tarjetas:
   si quedaba flotando sobre el contenido al hacer scroll, se veía como una
   etiqueta rota/vacía encima del bloque de abajo). */
.mic-cluster { position: fixed; right: 78px; bottom: 90px; z-index: 30; }
@media (min-width: 760px) { .mic-cluster { bottom: 24px; } }
.mic-fab {
  position: static;
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); font-size: 1.4rem;
  box-shadow: var(--shadow); cursor: pointer;
}
.mic-fab:disabled { cursor: not-allowed; }
.mic-fab.listening { background: var(--danger); color: #fff; border-color: var(--danger); animation: micpulse 1.1s infinite; }
@keyframes micpulse {
  0% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); }
  70% { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}
.block-train.block-activo { outline: 2px solid var(--accent); outline-offset: -2px; }

.mic-help-btn {
  position: absolute; top: -6px; right: -6px;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); font-size: .68rem; font-weight: 700;
  box-shadow: var(--shadow); cursor: pointer;
}

.tabla-ayuda-voz { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .84rem; }
.tabla-ayuda-voz td { padding: 7px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tabla-ayuda-voz td:first-child { white-space: nowrap; color: var(--accent); font-weight: 700; padding-right: 10px; }

.badge {
  display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px;
  border-radius: 999px; background: var(--border); color: var(--text-dim);
}
.warning-box {
  background: color-mix(in srgb, var(--warn) 15%, transparent);
  border: 1px solid var(--warn); color: var(--warn);
  border-radius: 10px; padding: 10px 12px; font-size: .82rem; margin-bottom: 12px;
}

/* Nutrición */
.nutri-resultado { margin-top: 4px; }
.nutri-kcal-meta { text-align: center; padding: 14px 0 10px; }
.nutri-kcal-num { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1; }
.nutri-kcal-label { font-size: .8rem; color: var(--text-dim); margin-top: 2px; }
.nutri-macros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.nutri-macro-chip {
  flex: 1; min-width: 90px; text-align: center;
  border: 1px solid var(--border); border-radius: 12px; padding: 8px 6px;
  border-top: 3px solid var(--border);
}
.nutri-macro-chip b { display: block; font-size: 1.05rem; }
.nutri-macro-chip span { display: block; font-size: .72rem; color: var(--text-dim); }
.nutri-macro-chip.prote { border-top-color: var(--ok); }
.nutri-macro-chip.carb { border-top-color: var(--accent); }
.nutri-macro-chip.grasa { border-top-color: var(--warn); }
.nutri-comida { margin-bottom: 10px; }
.nutri-comida-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg); }
.nutri-comida-head h2 { margin: 0; font-size: .95rem; }
.nutri-comida-body { padding: 10px 14px 14px; }
.nutri-item {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg-elev);
}
.nutri-item-add { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.nutri-item-add > div:first-child { flex: 2; min-width: 140px; }
.nutri-item-add > div:last-child { flex: 1; min-width: 80px; }
.nutri-macro-chip.completo { border-top-color: var(--ok); }
.nutri-grupo-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 4px; background: var(--bg-elev);
}
.nutri-grupo-row.completo { border-color: var(--ok); }
.nutri-grupo-nombre { font-weight: 700; font-size: .86rem; }
.nutri-grupo-count { font-size: .78rem; color: var(--text-dim); font-weight: 500; }
.nutri-porcion-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; padding: 3px 0 3px 4px; color: var(--text-dim); }
.nutri-menu-dia { margin-top: 14px; }
.nutri-menu-fila { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: .84rem; }
.nutri-menu-fila b { min-width: 78px; flex-shrink: 0; color: var(--text-dim); font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
.nutri-plato-idea {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid var(--accent); border-radius: 10px;
  padding: 8px 10px; font-size: .82rem; margin-bottom: 10px;
}
.nutri-plato-idea b { color: var(--accent); }
/* Pestañas internas de Nutrición (Registro / Resumen) */
.nutri-subtabs {
  display: flex; gap: 6px; margin-bottom: 14px; padding: 4px; scroll-margin-top: 64px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
}
.nutri-subtab {
  flex: 1; border: none; background: transparent; color: var(--text-dim); cursor: pointer;
  padding: 10px 8px; border-radius: 9px; font: inherit; font-weight: 700; font-size: .92rem;
}
.nutri-subtab.activa { background: var(--accent); color: var(--accent-text); }
.nutri-resumen { width: 100%; border-collapse: collapse; font-size: .8rem; }
.nutri-resumen th, .nutri-resumen td {
  padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums; vertical-align: top;
}
.nutri-resumen th:first-child, .nutri-resumen td:first-child { text-align: left; }
.nutri-resumen thead th { color: var(--text-dim); font-size: .7rem; text-transform: uppercase; }
.nutri-resumen tr.sec th { text-align: left; background: var(--bg); font-size: .82rem; padding: 8px 6px; }
.nutri-resumen tr.sub td { font-weight: 700; color: var(--text-dim); }
.nutri-resumen td small { color: var(--text-dim); }
.nutri-resumen td.sin { text-align: left; color: var(--warn); font-size: .74rem; }
.nutri-resumen tfoot td { font-weight: 700; }
.nutri-resumen tfoot tr.tot td { border-top: 2px solid var(--accent); }
.nutri-resumen .pasa, .pasa { color: var(--danger); font-weight: 700; }
.nutri-resumen thead th.c-kcal { color: var(--m-kcal); border-bottom: 2px solid var(--m-kcal); }
.nutri-resumen thead th.c-carb { color: var(--m-carb); border-bottom: 2px solid var(--m-carb); }
.nutri-resumen thead th.c-prot { color: var(--m-prot); border-bottom: 2px solid var(--m-prot); }
.nutri-resumen thead th.c-lip { color: var(--m-lip); border-bottom: 2px solid var(--m-lip); }
.nutri-resumen tfoot td.c-kcal { color: var(--m-kcal); }
.nutri-resumen tfoot td.c-carb { color: var(--m-carb); }
.nutri-resumen tfoot td.c-prot { color: var(--m-prot); }
.nutri-resumen tfoot td.c-lip { color: var(--m-lip); }
.nutri-resumen tfoot tr.tot td { font-size: .9rem; background: var(--bg); }
/* Tabla del Resumen: marco, líneas verticales entre columnas y títulos destacados */
.nutri-resumen-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.nutri-resumen-wrap.table-scroll { overflow-x: auto; }
.nutri-resumen { border-collapse: separate; border-spacing: 0; }
.nutri-resumen th, .nutri-resumen td { border-bottom: 1px solid var(--border); }
.nutri-resumen tr:last-child > td, .nutri-resumen tr:last-child > th { border-bottom: none; }

/* ---------------------------------------------------------------
   Bloques (supersets): 1.1+1.2 -> Bloque 1, 2.1+2.2 -> Bloque 2, etc.
   El número de bloque es la parte entera del campo "grupo".
--------------------------------------------------------------- */
function numeroBloque(e) {
  const n = parseInt(String(e.grupo).split(".")[0], 10);
  return isNaN(n) ? null : n;
}
function agruparPorBloque(ejercicios) {
  const map = new Map();
  const orden = [];
  ejercicios.forEach((e) => {
    const n = numeroBloque(e);
    const key = n == null ? "_" + e.id : String(n);
    if (!map.has(key)) { map.set(key, []); orden.push(key); }
    map.get(key).push(e);
  });
  return orden.map((key) => ({ key, numero: /^_/.test(key) ? null : parseInt(key, 10), ejercicios: map.get(key) }));
}
const DESCANSO_BLOQUE_DEFECTO = 120;
function descansoBloque(dia, key) {
  if (dia.bloqueDescanso && dia.bloqueDescanso[key] != null) return dia.bloqueDescanso[key];
  return DESCANSO_BLOQUE_DEFECTO;
}
function linkEjercicio(e) {
  if (e.enlace) return e.enlace;
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(e.nombre + " técnica ejercicio");

--------------------------------------------------------------- */

];
const METAS_PORCIONES_DEFECTO = { cereales: 4, carnes: 6, verduras: 3, frutas: 3, lacteos: 3, lipidos: 1, aceites: 1 };
// Cada string ya incluye la medida casera y el gramaje — equivalente a 1 porción de ese grupo.

// Valores nutricionales de un alimento de las porciones (con el gramaje que indica el plan), o null si es uno propio.
function macroDePorcion(grupo, alimento) {
  const idx = (ALIMENTOS_GRUPOS[grupo] || []).indexOf(alimento);
  if (idx < 0) return null;
  const base = buscarMacroAlimento((MACRO_POR_GRUPO[grupo] || [])[idx]);
  if (!base) return null;
  const m = /\((\d+(?:[.,]\d+)?)\s*g\)/.exec(alimento);
  const g = m ? parseFloat(m[1].replace(",", ".")) : base.g;
  const f = g / 100;
  return { g, kcal: base.k * f, carb: base.c * f, prot: base.p * f, lip: base.l * f };
}
function macrosDePorciones(comidas) {
  const tot = { kcal: 0, carb: 0, prot: 0, lip: 0 };
  let contados = 0;
  const sinValores = [];
  comidas.forEach((cm) => {
    cm.porciones.forEach((p) => {
      const m = macroDePorcion(p.grupo, p.alimento);
      if (!m) { sinValores.push(p.alimento); return; }
      tot.kcal += m.kcal; tot.carb += m.carb; tot.prot += m.prot; tot.lip += m.lip;
      contados++;
    });
    if (cm.productoColacion) sinValores.push(cm.productoColacion);
  });
  return { tot, contados, sinValores: [...new Set(sinValores)] };
}

function elegirAlAzar(arr, n) {
  const copia = [...arr];
  const out = [];
  for (let i = 0; i < n && copia.length; i++) out.push(copia.splice(Math.floor(Math.random() * copia.length), 1)[0]);

function generarComboAleatorio(plantilla) {
  const porciones = [];
  plantilla.formula.forEach((f) => {
    const opciones = alimentosDelGrupo(f.grupo);
    if (f.cant >= 1) {
      elegirAlAzar(opciones, Math.round(f.cant)).forEach((al) => {
        porciones.push({ id: "p_" + Math.random().toString(36).slice(2), grupo: f.grupo, alimento: al, cantidad: 1 });
      });
    } else {
      const elegido = elegirAlAzar(opciones, 1)[0];
      if (elegido) porciones.push({ id: "p_" + Math.random().toString(36).slice(2), grupo: f.grupo, alimento: elegido, cantidad: f.cant });
    }
  });
  let proteinaPolvo = false, productoColacion = null;
  if (plantilla.extraProteinaPolvo) {
    if (Math.random() < 0.5) proteinaPolvo = true;
    else productoColacion = PRODUCTOS_COLACION[Math.floor(Math.random() * PRODUCTOS_COLACION.length)];
  }
  let platoSugerido = null;
  const campoMinuta = PLANTILLA_CAMPO_MINUTA[plantilla.id];
  if (campoMinuta) {
    const platos = platosReferencia(campoMinuta);
    platoSugerido = platos[Math.floor(Math.random() * platos.length)];
  }

}
function fechaISOMenosDias(fechaISO, n) {
  const [y, m, d] = fechaISO.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() - n);
  const pad = (x) => String(x).padStart(2, "0");
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
}
function rangoUltimosDias(n) {

}
function promedio(arr, key) {
  return arr.length ? arr.reduce((a, d) => a + (d[key] || 0), 0) / arr.length : 0;
}
function buildChartPorciones(datos, metaTotal) {
  const valor = (d) => GRUPOS_NUTRICION.reduce((a, g) => a + (d[g.id] || 0), 0);
  const w = Math.max(320, datos.length * 40);
  const h = 160;
  const padL = 40, padB = 22, padT = 10;
  const maxVal = Math.max(1, metaTotal || 0, ...datos.map(valor));
  const barW = (w - padL - 10) / datos.length;
  const bars = datos.map((d, i) => {
    const v = valor(d);
    const x = padL + i * barW + barW * 0.15;
    const bw = barW * 0.7;
    const bh = (v / maxVal) * (h - padB - padT);
    const y = h - padB - bh;
    const color = !d.registrado ? "var(--border)" : (metaTotal && v > metaTotal * 1.1 ? "var(--warn)" : "var(--accent)");
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}"><title>${fmtFecha(d.fecha)}: ${fmtPorcion(v)} porciones</title></rect>`;
  }).join("");
  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + f * (h - padB - padT);
    const val = Math.round(maxVal * (1 - f));
    return `<line x1="${padL}" y1="${y}" x2="${w - 5}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
      <text x="2" y="${y + 4}" font-size="9" fill="var(--text-dim)">${val}</text>`;
  }).join("");
  let metaLine = "";
  if (metaTotal) {
    const metaY = h - padB - (metaTotal / maxVal) * (h - padB - padT);
    metaLine = `<line x1="${padL}" y1="${metaY.toFixed(1)}" x2="${w - 5}" y2="${metaY.toFixed(1)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="${w - 5}" y="${(metaY - 4).toFixed(1)}" font-size="9" fill="var(--ok)" text-anchor="end">meta</text>`;
  }
  const labels = datos.map((d, i) => {
    const x = padL + i * barW + barW / 2;
    return `<text x="${x.toFixed(1)}" y="${h - 6}" font-size="8" fill="var(--text-dim)" text-anchor="middle">${fmtFecha(d.fecha).slice(0, 5)}</text>`;
  }).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${gridLines}${bars}${metaLine}${labels}</svg>`;
}
function generarResumenPorciones(diasRegistrados, metasPorciones, periodoDias) {
  if (!diasRegistrados.length) return `No registraste comidas en los últimos ${periodoDias} días — cuando cargues algunas, aquí verás cómo te fue por grupo de alimentos.`;
  const promedios = {};
  GRUPOS_NUTRICION.forEach((g) => { promedios[g.id] = promedio(diasRegistrados, g.id); });
  const frases = [`Registraste comidas en ${diasRegistrados.length} de ${periodoDias} días.`];
  const faltantes = GRUPOS_NUTRICION.map((g) => ({ nombre: g.nombre, gap: (metasPorciones[g.id] || 0) - promedios[g.id] }))
    .filter((x) => x.gap > 0.5).sort((a, b) => b.gap - a.gap);
  if (faltantes.length) {
    frases.push(`Donde más te quedaste corto: ${faltantes.slice(0, 2).map((x) => x.nombre.toLowerCase()).join(" y ")} — revisa si te faltan porciones ahí cada día.`);
  } else {
    frases.push("Estás cumpliendo bien tus porciones diarias en todos los grupos, sigue así.");
  }
  const excesos = GRUPOS_NUTRICION.map((g) => ({ nombre: g.nombre, exceso: promedios[g.id] - (metasPorciones[g.id] || 0) * 1.2 }))
    .filter((x) => x.exceso > 0.3);
  if (excesos.length) frases.push(`Te pasaste seguido en: ${excesos.map((x) => x.nombre.toLowerCase()).join(" y ")}.`);
  return frases.join(" ");
}

/* ---------------------------------------------------------------
   Utilidades varias
--------------------------------------------------------------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function fmtFecha(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d.padStart(2, "0")}-${m.padStart(2, "0")}-${y}`;
}
function hoyISO() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------------------------------------------------------------
   Modales propios (reemplazan prompt/confirm/alert nativos:
   más consistentes entre navegador de escritorio, celular y tablet)
--------------------------------------------------------------- */
function modalBase(titleHtml, bodyHtml, buttons) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `<div class="modal-card">
      <h3 class="modal-title">${titleHtml}</h3>
      <div class="modal-body">${bodyHtml}</div>
      <div class="btn-row modal-actions"></div>
    </div>`;
    document.body.appendChild(overlay);

    let settled = false;
    function finish(value) {
      if (settled) return;
      settled = true;
      overlay.remove();
      resolve(value);
    }

    const actions = overlay.querySelector(".modal-actions");
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.className = "btn" + (b.ghost ? " ghost" : "") + (b.danger ? " danger" : "") + (b.block ? " block" : "");
      btn.textContent = b.label;
      btn.addEventListener("click", () => finish(b.getValue ? b.getValue(overlay) : b.value));
      actions.appendChild(btn);
    });

    overlay.addEventListener("click", (e) => { if (e.target === overlay) finish(null); });
    overlay.addEventListener("keydown", (e) => {
      if (e.key === "Escape") finish(null);
      if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
        e.preventDefault();
        actions.lastElementChild && actions.lastElementChild.click();
      }
    });

    const firstField = overlay.querySelector("input, textarea");
    if (firstField) {
      firstField.focus();
      if (firstField.select) firstField.select();
    }
  });
}

function volumenEjercicio(seriesLog) {
  return seriesLog.reduce((acc, s) => {
    const r = parseFloat(s.reps) || 0;
    const k = parseFloat(s.kg) || 0;
    return acc + r * k;
  }, 0);
}

/* ---------------------------------------------------------------
   Navegación por pestañas
--------------------------------------------------------------- */
const TABS = ["entrenar", "rutina", "historial", "perfil", "nutricion", "datos"];
let tabActual = "entrenar";
function showTab(tab) {
  tabActual = tab;
  TABS.forEach((t) => {
    document.getElementById("view-" + t).hidden = t !== tab;
  });
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".bn-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  // El micrófono y el botón del cronómetro solo sirven mientras entrenas —
  // en el resto de las pestañas solo estorban (llegaron a taparse con
  // controles propios de esas vistas, como eliminar un bloque en Rutina).
  document.getElementById("timerFab").hidden = tab !== "entrenar";
  document.querySelector(".mic-cluster").hidden = tab !== "entrenar";
  if (tab === "entrenar") renderEntrenar();
  if (tab === "rutina") renderRutina();
  if (tab === "historial") renderHistorial();
  if (tab === "perfil") renderPerfil();
  if (tab === "nutricion") renderNutricion();
  if (tab === "datos") renderDatos();
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab-btn");
  if (b) showTab(b.dataset.tab);
});
document.getElementById("bottomnav").addEventListener("click", (e) => {
  const b = e.target.closest(".bn-btn");
  if (b) showTab(b.dataset.tab);
});

function renderNutricion() {
  const c = document.getElementById("nutricionContent");
  const comidas = getComidasDelDia(nutricionFecha);
  const consumidoDia = totalesPorcionesDia(comidas);

  const diasPeriodo = rangoUltimosDias(nutricionPeriodo);
  const datosPeriodo = diasPeriodo.map((f) => {
    const cms = comidasDias[f] || [];
    const tot = totalesPorcionesDia(cms);
    const registrado = cms.some((cm) => cm.porciones.length > 0);
    return { fecha: f, ...tot, registrado };
  });
  const registrados = datosPeriodo.filter((d) => d.registrado);
  const metaTotalDia = GRUPOS_NUTRICION.reduce((a, g) => a + (nutricion.metasPorciones[g.id] || 0), 0);
  const resumenTexto = generarResumenPorciones(registrados, nutricion.metasPorciones, nutricionPeriodo);

  const entradasMacro = comidasMacros[nutricionFecha] || [];
  // Cada "Proteína en polvo" marcada en las comidas del día cuenta como 1 scoop dentro del conteo de macros.
  const nScoops = comidas.filter((cm) => cm.proteinaPolvo).length;
  const scoopV = scoopActual();
  const totBase = totalesMacros(entradasMacro);
  // Lo elegido en "Comidas del día" (porciones) también suma, con el gramaje que indica el plan.
  const pm = macrosDePorciones(comidas);
  const nBarras = comidas.filter((cm) => cm.barraProteina).length;
  const barraV = barraProteinaValores();
  const totMacro = {
    kcal: totBase.kcal + nScoops * scoopV.kcal + nBarras * barraV.kcal + pm.tot.kcal,
    carb: totBase.carb + nScoops * scoopV.carb + nBarras * barraV.carb + pm.tot.carb,
    prot: totBase.prot + nScoops * scoopV.prot + nBarras * barraV.prot + pm.tot.prot,
    lip: totBase.lip + nScoops * scoopV.lip + nBarras * barraV.lip + pm.tot.lip,
  };
  const metaMacro = {
    kcal: parseFloat(nutricion.calorias) || 0, carb: parseFloat(nutricion.carbohidratos) || 0,
    prot: parseFloat(nutricion.proteinas) || 0, lip: parseFloat(nutricion.lipidos) || 0,
  };
  function barraMacroHtml(titulo, unidad, cons, meta, esProteina, tipo) {
    const consTxt = unidad === "kcal" ? Math.round(cons).toLocaleString("es-CL") : fmtMacro(cons);
    const etiqueta = `<span class="mlabel ${tipo}">${titulo}</span>`;
    if (!(meta > 0)) {
      return `<div class="nutri-bar-row m-${tipo}"><div class="nutri-bar-head">${etiqueta}<span>${consTxt} ${unidad}</span></div>
        <div class="nutri-bar-foot">Define tu meta arriba para ver cuánto te falta.</div></div>`;
    }
    const metaTxt = unidad === "kcal" ? Math.round(meta).toLocaleString("es-CL") : fmtMacro(meta);
    const falta = meta - cons;
    const pct = (cons / meta) * 100;
    const fmtD = (n) => (unidad === "kcal" ? Math.round(n).toLocaleString("es-CL") : fmtMacro(n));
    let estado, clase = "";
    if (Math.abs(falta) < 0.5) { estado = "Meta cumplida ✅"; clase = "ok"; }
    else if (falta > 0) { estado = `Te faltan ${fmtD(falta)} ${unidad}`; }
    else if (esProteina) { estado = `Superaste tu meta por ${fmtD(-falta)} ${unidad} ✅`; clase = "ok"; }
    else if (pct <= 105) { estado = `Meta cumplida ✅ (+${fmtD(-falta)} ${unidad})`; clase = "ok"; }
    else { estado = `Te pasaste por ${fmtD(-falta)} ${unidad}`; clase = "over"; }
    return `<div class="nutri-bar-row m-${tipo}">
      <div class="nutri-bar-head">${etiqueta}<span>Llevas ${consTxt} de ${metaTxt} ${unidad}</span></div>
      <div class="nutri-bar"><div class="nutri-bar-fill ${clase}" style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%"></div></div>
      <div class="nutri-bar-foot ${clase}">${estado}</div>
    </div>`;
  }

  // --- Acordeones: cabecera con resumen para no tener que abrir cada sección ---
  const abre = (id) => nutriSeccion === id;
  const accHead = (id, titulo, resumen) =>
    `<button type="button" class="nutri-acc-head" data-nutri-sec="${id}" aria-expanded="${abre(id)}">` +
    `<span class="nutri-acc-chev">${abre(id) ? "▾" : "▸"}</span><span class="nutri-acc-title">${titulo}</span>` +
    `<span class="nutri-acc-sum">${resumen}</span></button>`;
  const kcalTxt = (n) => Math.round(n).toLocaleString("es-CL");
  const resumenMetas = pillsMacro(metaMacro.kcal, metaMacro.carb, metaMacro.prot, metaMacro.lip);
  const resumenConteo = `<span class="mpills">` +
    `<span class="mpill kcal">${kcalTxt(totMacro.kcal)} / ${kcalTxt(metaMacro.kcal)} kcal</span>` +
    `<span class="mpill carb"><i>C</i> ${fmtMacro(totMacro.carb)}/${fmtMacro(metaMacro.carb)}</span>` +
    `<span class="mpill prot"><i>P</i> ${fmtMacro(totMacro.prot)}/${fmtMacro(metaMacro.prot)}</span>` +
    `<span class="mpill lip"><i>L</i> ${fmtMacro(totMacro.lip)}/${fmtMacro(metaMacro.lip)}</span></span>`;

  // --- Anillo de calorías: lo primero que se mira es cuántas calorías te restan ---
  const restanKcal = metaMacro.kcal - totMacro.kcal;
  const excedidoKcal = metaMacro.kcal > 0 && restanKcal < -0.5;
  const pctRing = metaMacro.kcal > 0 ? Math.min(100, Math.max(0, (totMacro.kcal / metaMacro.kcal) * 100)) : 0;
  const RADIO_RING = 52, CIRC_RING = 2 * Math.PI * RADIO_RING;

      <div class="nutri-ring ${excedidoKcal ? "excedido" : ""}" role="img"
           aria-label="${excedidoKcal ? "Te pasaste por " + kcalTxt(-restanKcal) : "Te restan " + kcalTxt(restanKcal)} kcal">

        <div class="${excedidoKcal ? "mas" : "res"}"><b>${kcalTxt(Math.abs(restanKcal))}</b><span>${excedidoKcal ? "De más" : "Restan"}</span></div>
      </div>
      <div class="nutri-hero-cap">Llevas ${kcalTxt(totMacro.kcal)} de ${kcalTxt(metaMacro.kcal)} kcal (${Math.round((totMacro.kcal / metaMacro.kcal) * 100)}%)</div>
    </div>` : `<p class="exercise-hint">Define tu meta de calorías en "Mis metas" para ver cuánto te resta.</p>`;
  const porcionesCumplidas = GRUPOS_NUTRICION.reduce((a, g) => a + Math.min(consumidoDia[g.id] || 0, nutricion.metasPorciones[g.id] || 0), 0);

    const tieneLeche = cm.porciones.some((p) => p.alimento === LECHE_PRO_ALIMENTO);
    const productosHtml = plantilla.extraProductos ? `

    const abierta = idx === nutriComidaAbierta;

    return `

  }

  // --- Pestaña Resumen: qué aportó cada alimento a cada conteo (calorías, C, P, L) ---
  const seccionesResumen = [];
  comidas.forEach((cm) => {
    const filas = cm.porciones.map((p) => {
      const m = macroDePorcion(p.grupo, p.alimento);

    });
    if (cm.proteinaPolvo) filas.push({ nombre: "💪 Proteína en polvo (1 scoop)", kcal: scoopV.kcal, carb: scoopV.carb, prot: scoopV.prot, lip: scoopV.lip });
    if (cm.barraProteina) filas.push({ nombre: "🍫 Barra Wild Protein (1 unidad, 45 g)", kcal: barraV.kcal, carb: barraV.carb, prot: barraV.prot, lip: barraV.lip });
    if (cm.productoColacion) filas.push({ nombre: cm.productoColacion, sin: true });
    const iconos = { desayuno: "🌅", colacion_manana: "🍎", almuerzo: "🍽️", colacion_tarde: "🥪", once_cena: "🌙" };
    if (filas.length) seccionesResumen.push({ titulo: cm.nombre, icono: iconos[cm.plantillaId] || "🍴", filas });
  });
  if (entradasMacro.length) {
    seccionesResumen.push({
      titulo: "Anotado aparte en el conteo",
      icono: "✍️",
      filas: entradasMacro.map((e) => ({ nombre: e.nombre, g: e.gramos, kcal: e.kcal, carb: e.carb, prot: e.prot, lip: e.lip })),
    });
  }
  const sumaFilas = (filas) => filas.reduce((a, f) => (f.sin ? a : {
    kcal: a.kcal + f.kcal, carb: a.carb + f.carb, prot: a.prot + f.prot, lip: a.lip + f.lip,
  }), { kcal: 0, carb: 0, prot: 0, lip: 0 });
  const celdasMacro = (o) => `<td class="c-kcal">${kcalTxt(o.kcal)}</td><td class="c-carb">${fmtMacro(o.carb)}</td><td class="c-prot">${fmtMacro(o.prot)}</td><td class="c-lip">${fmtMacro(o.lip)}</td>`;
  const celdas4 = (a, b, c2, d) => `<td class="c-kcal">${a}</td><td class="c-carb">${b}</td><td class="c-prot">${c2}</td><td class="c-lip">${d}</td>`;
  const totResumen = { kcal: 0, carb: 0, prot: 0, lip: 0 };
  const cuerpoResumen = seccionesResumen.map((s) => {
    const sub = sumaFilas(s.filas);
    s.sub = sub;
    totResumen.kcal += sub.kcal; totResumen.carb += sub.carb; totResumen.prot += sub.prot; totResumen.lip += sub.lip;
    return `<tr class="sec"><th colspan="5">${s.icono ? s.icono + " " : ""}${esc(s.titulo)}</th></tr>` +
      s.filas.map((f) => (f.sin
        ? `<tr><td>${esc(f.nombre)}</td><td colspan="4" class="sin">no suma: sin valores</td></tr>`
        : `<tr><td>${esc(f.nombre)}${f.g && !/\(\s*\d+(?:[.,]\d+)?\s*(?:g|ml|cc)\)/.test(f.nombre) ? `<br><small>${fmtMacro(f.g)} g</small>` : ""}</td>${celdasMacro(f)}</tr>`)).join("") +
      (s.filas.length > 1 ? `<tr class="sub"><td>Subtotal</td>${celdasMacro(sub)}</tr>` : "");
  }).join("");
  const pctDe = (v, m) => (m > 0 ? Math.round((v / m) * 100) + "%" : "–");
  const faltaDe = (v, m, kcal) => {
    if (!(m > 0)) return "–";
    const d = m - v;
    const f = (x) => (kcal ? kcalTxt(x) : fmtMacro(x));

    <div class="card">

      <p class="exercise-hint" style="margin-top:14px">Aquí se junta todo: <b>lo que elijas en "Comidas del día" (y el

    <div class="card nutri-acc ${abre("comidas") ? "abierta" : ""}">

      <div class="nutri-macros" style="margin-top:10px">
